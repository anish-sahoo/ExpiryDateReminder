name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analysis, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Everything the ciCheck task runs, in one step, so the local and CI gates cannot
      # drift apart. Run `./gradlew ciCheck` before pushing to get the same answer.
      - name: ciCheck
        run: ./gradlew ciCheck --no-daemon --stacktrace

      # Reports are far more useful than the log when something fails, and they are the
      # only artefact of a red run worth keeping.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            **/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM has to be enabled explicitly or the emulator falls back to software rendering
      # and the suite times out rather than failing honestly.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: composeApp/build/reports/androidTests/**
          retention-days: 7
          if-no-files-found: ignore

  bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check, e2e]
    # Only on main: this proves the release variant still assembles, which is what actually
    # ships to Play. It is unsigned here — the upload keystore never enters CI.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle release
        run: ./gradlew :composeApp:bundleRelease --no-daemon

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: composeApp/build/outputs/bundle/release/*.aab
          retention-days: 14
